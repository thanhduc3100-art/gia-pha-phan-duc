<script>
    // Logic cho Banner tự động chuyển
    let currentSlide = 0;
    const desktopSlides = document.querySelectorAll(".desktop-slide");
    const mobileSlides = document.querySelectorAll(".mobile-slide");

    function nextSlide() {
        if (desktopSlides.length > 0) {
            desktopSlides[currentSlide].classList.remove("active");
            mobileSlides[currentSlide].classList.remove("active");
            
            currentSlide = (currentSlide + 1) % desktopSlides.length;
            
            desktopSlides[currentSlide].classList.add("active");
            mobileSlides[currentSlide].classList.add("active");
        }
    }
    setInterval(nextSlide, 4000);
</script>
